services:
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    ports: ['8000:8000']
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_farm}
      MYSQL_USER: ${MYSQL_USER:-farm_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-farm_app_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports: ['${MYSQL_PORT:-3307}:3306']
    volumes: ['mysql_data:/var/lib/mysql']
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-root_local_password}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      FRONTEND_URL: http://localhost:5173
      DATABASE_URL: mysql://${MYSQL_USER:-farm_app}:${MYSQL_PASSWORD:-farm_app_local_password}@mysql:3306/${MYSQL_DATABASE:-digital_farm}
      JWT_SECRET: ${JWT_SECRET:-local-only-change-before-real-use-minimum-32-chars}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      AWS_REGION: ${AWS_REGION:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      S3_PRESIGNED_URL_EXPIRY_SECONDS: ${S3_PRESIGNED_URL_EXPIRY_SECONDS:-300}
      MAX_PRIVATE_FILE_SIZE_BYTES: ${MAX_PRIVATE_FILE_SIZE_BYTES:-10485760}
      ML_SERVICE_URL: http://ml:8000
      LLM_PROVIDER: ${LLM_PROVIDER:-OPENAI_COMPATIBLE}
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    ports: ['3000:3000']
    depends_on:
      mysql: { condition: service_healthy }
      ml: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args: { VITE_API_BASE_URL: http://localhost:3000/api/v1 }
    ports: ['5173:80']
    depends_on:
      backend: { condition: service_healthy }
volumes:
  mysql_data:
